<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-chart-dsl · JSON 驱动图表</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --panel: #fff;
        --line: #dee2e6;
        --text: #212529;
        --muted: #6c757d;
        --primary: #0d6efd;
        --danger: #dc3545;
        --warning: #b58105;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 1.25rem 1.5rem 3rem; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; font-size: 14px;
      }
      h1 { margin: 0 0 0.25rem; font-size: 1.35rem; font-weight: 600; }
      p.lead { margin: 0 0 1rem; color: var(--muted); font-size: 0.875rem; line-height: 1.7; }
      .layout { display: grid; grid-template-columns: minmax(360px, 44%) 1fr; gap: 1rem; align-items: start; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }
      button {
        font: inherit; font-size: 12px; padding: 0.25rem 0.6rem; border: 1px solid var(--line);
        border-radius: 4px; background: #fff; color: var(--text); cursor: pointer;
      }
      button:hover { border-color: var(--primary); color: var(--primary); }
      button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      textarea {
        width: 100%; height: 30rem; resize: vertical; padding: 0.6rem; border: 1px solid var(--line);
        border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; line-height: 1.6; color: var(--text); background: #fff;
      }
      canvas { display: block; }
      #diagnostics {
        margin: 0.6rem 0 0; padding: 0.5rem 0.65rem; max-height: 12rem; overflow: auto;
        border: 1px solid var(--line); border-radius: 4px; background: #f8f9fa;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.7;
        white-space: pre-wrap;
      }
      .error { color: var(--danger); }
      .warning { color: var(--warning); }
      .ok { color: #198754; }
      .meta { color: var(--muted); font-size: 12px; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>ice-chart-dsl · JSON 驱动图表</h1>
    <p class="lead">
      左边写 DSL（一张表 + <code>encoding</code> 把列绑到通道上），右边立刻编译成 <code>ChartOption</code> 渲染出来。
      编译产物就是 ice-chart 的普通配置 —— 悬停 / 缩放 / 框选 / 序列化全部照旧。下面的诊断面板是给 agent 看的：
      列写错了、公式画不出来，都会带着位置报回来。
    </p>
    <div class="layout">
      <div class="card">
        <div class="toolbar">
          <button class="primary" id="btn-render">渲染</button>
          <button data-preset="line">折线（分组）</button>
          <button data-preset="bar">柱形（堆叠）</button>
          <button data-preset="pie">饼图</button>
          <button data-preset="scatter">气泡</button>
          <button data-preset="function">表达式</button>
          <button data-preset="radar">雷达</button>
          <button data-preset="heatmap">热力图</button>
          <button data-preset="candlestick">K 线</button>
          <button data-preset="waterfall">瀑布</button>
          <button data-preset="sankey">桑基</button>
          <button data-preset="annotation">标注（目标线 / 达标区）</button>
          <button data-preset="bad-annotation">标注错误示例</button>
          <button data-preset="bad-column">错误示例</button>
        </div>
        <textarea id="dsl" spellcheck="false"></textarea>
        <pre id="diagnostics">…</pre>
      </div>
      <div class="card">
        <canvas id="chart" width="760" height="520"></canvas>
        <div class="meta" id="meta">—</div>
      </div>
    </div>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../node_modules/@damoqiongqiu/ice-chart/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      /**
       * 图表 DSL 渲染示例页。
       *
       * 页面写法与家族其它示例一致：**一页 = 一个类**，构造期把 DOM 引用、事件与首次渲染一次做完。
       * 这页的"变化"是**用户驱动**的（改 JSON / 换预设后点渲染），不是宿主推数据，所以刷新入口就是 `onUpdate()`（按钮点它重渲）。
       */
      class ChartDslPage {
        static PRESETS = {
        line: {
          schemaVersion: 1,
          kind: 'line',
          title: '月度销量（线上 / 线下）',
          data: {
            columns: ['月份', '销量', '渠道'],
            rows: [
              ['1月', 120, '线上'], ['1月', 86, '线下'],
              ['2月', 142, '线上'], ['2月', 92, '线下'],
              ['3月', 168, '线上'], ['3月', 78, '线下'],
              ['4月', 154, '线上'], ['4月', 110, '线下'],
              ['5月', 186, '线上'], ['5月', 124, '线下'],
            ],
          },
          encoding: { x: '月份', y: '销量', series: '渠道' },
          options: { crosshair: { show: true, axis: 'x', showAxisLabel: true } },
        },
        bar: {
          schemaVersion: 1,
          kind: 'bar',
          title: '各区域收入（堆叠）',
          data: {
            columns: ['区域', '收入', '业务线'],
            rows: [
              ['华东', 320, 'SaaS'], ['华东', 180, '硬件'],
              ['华南', 260, 'SaaS'], ['华南', 140, '硬件'],
              ['华北', 210, 'SaaS'], ['华北', 160, '硬件'],
            ],
          },
          encoding: { x: '区域', y: '收入', series: '业务线' },
          options: { stack: true },
        },
        pie: {
          schemaVersion: 1,
          kind: 'pie',
          title: '流量来源',
          data: {
            columns: ['来源', '会话数'],
            rows: [['自然搜索', 4200], ['信息流', 3100], ['社交媒体', 1800], ['直接访问', 900]],
          },
          encoding: { name: '来源', value: '会话数' },
        },
        scatter: {
          schemaVersion: 1,
          kind: 'scatter',
          title: '客单价 vs 复购率（气泡=订单量）',
          data: {
            columns: ['客单价', '复购率', '订单量'],
            rows: [[120, 0.32, 800], [180, 0.41, 1200], [260, 0.28, 400], [90, 0.55, 1600], [320, 0.22, 260]],
          },
          encoding: { x: '客单价', y: '复购率', size: '订单量' },
        },
        function: {
          schemaVersion: 1,
          kind: 'function',
          title: '阻尼振荡',
          expression: 'a*exp(-b*x)*sin(c*x)',
          domain: [-1, 12],
          params: { a: 1.8, b: 0.18, c: 3 },
          options: { yAxis: { min: -2.2, max: 2.2 } },
        },
        radar: {
          schemaVersion: 1,
          kind: 'radar',
          title: '机房健康度',
          data: {
            columns: ['指标', '得分', '机房'],
            rows: [
              ['算力', 92, 'A 机房'], ['存储', 74, 'A 机房'], ['网络', 86, 'A 机房'], ['告警', 68, 'A 机房'],
              ['算力', 78, 'B 机房'], ['存储', 88, 'B 机房'], ['网络', 71, 'B 机房'], ['告警', 82, 'B 机房'],
            ],
          },
          encoding: { x: '指标', y: '得分', series: '机房' },
        },
        heatmap: {
          schemaVersion: 1,
          kind: 'heatmap',
          title: '时段 × 区域 负载',
          data: {
            columns: ['时段', '区域', '负载'],
            rows: [
              ['T1', '华东', 42], ['T1', '华北', 55], ['T1', '华南', 38],
              ['T2', '华东', 68], ['T2', '华北', 74], ['T2', '华南', 46],
              ['T3', '华东', 91], ['T3', '华北', 66], ['T3', '华南', 58],
              ['T4', '华东', 74], ['T4', '华北', 52], ['T4', '华南', 63],
            ],
          },
          encoding: { x: '时段', y: '区域', value: '负载' },
        },
        candlestick: {
          schemaVersion: 1,
          kind: 'candlestick',
          title: '近 6 日行情',
          data: {
            columns: ['日期', '开', '收', '低', '高'],
            rows: [
              ['1日', 32.1, 33.4, 31.8, 33.9],
              ['2日', 33.4, 32.6, 32.2, 34.1],
              ['3日', 32.6, 34.8, 32.5, 35.2],
              ['4日', 34.8, 36.2, 34.4, 36.7],
              ['5日', 36.2, 35.1, 34.7, 36.4],
              ['6日', 35.1, 37.4, 35.0, 37.8],
            ],
          },
          encoding: { x: '日期', y: ['开', '收', '低', '高'] },
        },
        waterfall: {
          schemaVersion: 1,
          kind: 'waterfall',
          title: '单票利润构成',
          data: {
            columns: ['项目', '金额', '合计'],
            rows: [
              ['营业收入', 4200, 0],
              ['营业成本', -1860, 0],
              ['销售费用', -720, 0],
              ['管理费用', -430, 0],
              ['其它收益', 260, 0],
              ['净利润', 0, 1],
            ],
          },
          encoding: { name: '项目', value: '金额', total: '合计' },
        },
        sankey: {
          schemaVersion: 1,
          kind: 'sankey',
          title: '渠道 → 页面 → 结果',
          data: {
            columns: ['来源', '去向', '流量'],
            rows: [
              ['自然搜索', '首页', 420], ['信息流', '首页', 300], ['社交媒体', '首页', 220],
              ['首页', '列表页', 520], ['首页', '流失', 420],
              ['列表页', '详情页', 430], ['列表页', '流失', 90],
              ['详情页', '下单', 300], ['详情页', '流失', 130],
            ],
          },
          encoding: { source: '来源', target: '去向', value: '流量' },
        },
        'bad-column': {
          schemaVersion: 1,
          kind: 'line',
          data: { columns: ['月份', '销量'], rows: [['1月', 120], ['2月', 132]] },
          encoding: { x: '月份', y: '销售额' },
        },
        annotation: {
          schemaVersion: 1,
          kind: 'line',
          title: '月度销量与目标（annotation）',
          data: {
            columns: ['月份', '销量'],
            rows: [['1月', 120], ['2月', 132], ['3月', 101], ['4月', 88], ['5月', 156], ['6月', 174]],
          },
          encoding: { x: '月份', y: '销量' },
          annotation: {
            lines: [
              { axis: 'y', value: 150, text: '目标 150' },
              { axis: 'y', value: 100, text: '告警阈值 100', color: '#dc3545', textPosition: 'start' },
              { axis: 'x', value: '4月', text: '促销' },
            ],
            points: [{ x: '4月', y: 88, text: '异常点', color: '#dc3545', symbol: 'diamond' }],
            areas: [{ axis: 'y', from: 0, to: 100, text: '达标区', textPosition: 'start' }],
          },
        },
        'bad-annotation': {
          schemaVersion: 1,
          kind: 'line',
          data: { columns: ['月份', '销量'], rows: [['1月', 120], ['2月', 132]] },
          encoding: { x: '月份', y: '销量' },
          annotation: {
            lines: [{ axis: 'y', text: '忘了写值' }, { axis: 'x', value: '13月', text: '不存在的月份' }],
          },
        },
      };

        constructor() {
          this.$ = (id) => document.getElementById(id);
          /** 当前图表实例（重渲染前要先 destroy） */
          this.chart = null;

          this.__wireToolbar();
          this.loadPreset('line');
        }

        onUpdate() {
        let dsl;
        try {
          dsl = JSON.parse(this.$('dsl').value);
        } catch (err) {
          this.$('diagnostics').innerHTML = '<span class="error">[错误] JSON 解析失败：' + err.message + '</span>';
          this.$('meta').textContent = '—';
          return;
        }
        const result = ICEChartDSL.validateChartDsl(dsl);
        const lines = [...result.errors, ...result.warnings].map((item) => {
          const cls = item.severity === 'error' ? 'error' : 'warning';
          const tag = item.severity === 'error' ? '[错误]' : '[警告]';
          return '<span class="' + cls + '">' + tag + '</span> ' + item.message + (item.path ? '（' + item.path + '）' : '');
        });
        this.$('diagnostics').innerHTML = lines.length ? lines.join('\n') : '<span class="ok">✓ 校验通过</span>';
        if (!result.valid) {
          this.$('meta').textContent = '校验不通过：' + result.errors.length + ' 个错误';
          return;
        }
        try {
          const option = ICEChartDSL.compileChartDsl(dsl);
          if (this.chart) this.chart.destroy();
          this.chart = ICEChart.createChart('chart', option);
          const json = this.chart.toJSONString();
          this.$('meta').textContent =
            '编译产物：' + option.series.length + ' 个系列 · ' + Math.round(json.length / 1024 * 10) / 10 + ' KB JSON（chart.toJSONString()）';
        } catch (err) {
          this.$('diagnostics').innerHTML = '<span class="error">[错误] ' + err.message + '</span>';
        }
        }

        loadPreset(name) {
          this.$('dsl').value = JSON.stringify(ChartDslPage.PRESETS[name], null, 2);
          this.onUpdate();
        }

        __wireToolbar() {
          document.querySelectorAll('[data-preset]').forEach((button) => {
            button.addEventListener('click', () => this.loadPreset(button.dataset.preset));
          });
          this.$('btn-render').addEventListener('click', () => this.onUpdate());
        }
      }

      new ChartDslPage();
    </script>
  </body>
</html>
